<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vitora | Smart Pharm</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card2: #19243d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #1d8cf8;
      --green: #10b981;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 84px; -webkit-tap-highlight-color: transparent; }

    /* HEADER & SEARCH */
    .header { padding: 14px 16px 8px; position: sticky; top: 0; background: rgba(11,17,32,0.95); backdrop-filter: blur(8px); z-index: 20; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px;
    }
    .search-box input {
      background: transparent; border: none; outline: none; color: var(--text);
      font-size: 15px; width: 100%;
    }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 4px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 7px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

    /* SECTIONS & GRID */
    .section { padding: 10px 16px; display: none; }
    .section.active { display: block; }
    .sec-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .p-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: transform 0.12s;
    }
    .p-card:active { transform: scale(0.98); }
    .p-thumb {
      position: relative; height: 118px; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .p-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .p-id-badge {
      position: absolute; top: 6px; left: 6px; background: rgba(11,17,32,0.8);
      color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
    }
    .p-emoji { font-size: 36px; margin-bottom: 4px; }
    .p-tag-txt { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #1e293b; }
    .p-name {
      font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .p-cat { font-size: 11px; color: var(--accent); margin-bottom: 3px; }
    .p-desc { font-size: 11px; color: var(--muted); margin-bottom: 4px; line-height: 1.25; }
    .p-stock { font-size: 11px; color: var(--green); margin-bottom: 8px; }
    .p-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .p-price { font-size: 14px; font-weight: 700; }
    .add-btn {
      width: 34px; height: 34px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 20px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* PRODUCT DETAIL MODAL (FULL SCREEN) */
    .detail-modal {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      overflow-y: auto; display: none; padding-bottom: 30px;
    }
    .detail-modal.open { display: block; }
    .dm-topbar {
      position: sticky; top: 0; z-index: 15; background: rgba(11,17,32,0.92);
      backdrop-filter: blur(8px); padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    }
    .dm-back {
      background: rgba(255,255,255,0.08); border: none; color: #fff;
      font-size: 15px; font-weight: 600; padding: 7px 14px; border-radius: 10px; cursor: pointer;
    }
    .dm-hero {
      margin: 0 16px 14px; height: 210px; border-radius: 18px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .dm-hero img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .dm-body { padding: 0 16px; }
    .dm-title { font-size: 20px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
    .dm-sub { font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 14px; }
    .dm-price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .dm-price { font-size: 26px; font-weight: 800; }
    .dm-avail { color: var(--green); font-size: 14px; font-weight: 700; }
    .dm-unit-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    .dm-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .dm-pill {
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .pill-pink { background: rgba(244,63,94,0.16); color: #fda4af; }
    .pill-blue { background: rgba(56,189,248,0.16); color: #7dd3fc; }
    .pill-amber { background: rgba(245,158,11,0.16); color: #fcd34d; }

    .dm-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .dm-kv { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; font-size: 13px; }
    .dm-kv:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dm-k { color: var(--muted); flex-shrink: 0; }
    .dm-v { text-align: right; font-weight: 500; line-height: 1.35; }

    .dm-warn {
      background: rgba(180,83,9,0.18); border: 1px solid rgba(245,158,11,0.28);
      color: #fde68a; border-radius: 14px; padding: 12px 14px;
      font-size: 12.5px; line-height: 1.4; margin-bottom: 16px;
    }

    .dm-action-bar { display: flex; gap: 12px; margin-bottom: 22px; }
    .qty-stepper {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 14px; padding: 0 12px; width: 122px; height: 50px;
    }
    .qty-stepper button {
      background: none; border: none; color: var(--accent); font-size: 22px;
      font-weight: 700; width: 32px; height: 32px; cursor: pointer;
    }
    .qty-stepper span { font-size: 17px; font-weight: 700; }
    .dm-cart-btn {
      flex: 1; height: 50px; border-radius: 14px; border: none;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    .rel-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
    .rel-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .rel-row::-webkit-scrollbar { display: none; }
    .rel-card {
      min-width: 138px; max-width: 138px; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 8px; cursor: pointer;
    }
    .rel-thumb {
      height: 82px; border-radius: 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin-bottom: 6px; overflow: hidden;
    }
    .rel-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .rel-name {
      font-size: 12px; font-weight: 600; line-height: 1.25; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rel-price { font-size: 12.5px; font-weight: 700; color: var(--accent); }

    /* CART & FORM */
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px;
    }
    .form-group { margin-top: 12px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 14px;
    }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--green); color: #fff; font-size: 16px; font-weight: 700;
      margin-top: 16px; cursor: pointer;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 66px;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 50;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--muted); font-size: 11px; cursor: pointer; position: relative;
    }
    .nav-item.active { color: var(--accent); font-weight: 700; }
    .nav-icon { font-size: 20px; }
    .badge {
      position: absolute; top: -4px; right: -8px; background: #ef4444; color: #fff;
      font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 10px;
    }
    .toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: #fff; padding: 9px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600; z-index: 200; display: none;
    }
  </style>
</head>
<body>

<div class="toast" id="toast">Savatga qo‘shildi!</div>

<!-- SEARCH & CATEGORIES -->
<div class="header" id="topHeader">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Дори ёки БАД номини излаш..." oninput="renderProducts()" />
  </div>
  <div class="cats" id="catBar"></div>
</div>

<!-- HOME / CATALOG -->
<div class="section active" id="sec-home">
  <div class="sec-title" id="secTitle">Оммабоп маҳсулотлар</div>
  <div class="grid" id="productGrid"></div>
</div>

<!-- CART / ORDERS -->
<div class="section" id="sec-cart">
  <div class="sec-title">🛒 Саватча ва Буюртма</div>
  <div id="cartList"></div>
  <div id="cartTotalBox" style="font-size:17px;font-weight:700;margin:12px 0;"></div>

  <div id="orderForm" style="display:none;">
    <div class="form-group">
      <label>Исмингиз</label>
      <input type="text" id="inpName" placeholder="Исмингизни киритинг" />
    </div>
    <div class="form-group">
      <label>Телефон рақамингиз</label>
      <input type="tel" id="inpPhone" placeholder="+998 90 123 45 67" />
    </div>
    <div class="form-group">
      <label>Олиб кетиш усули</label>
      <select id="inpDelivery" onchange="toggleAddress()">
        <option value="Дорихонадан олиб кетиш">🏥 Дорихонадан олиб кетиш</option>
        <option value="Курьер орқали етказиб бериш">🚚 Курьер орқали етказиб бериш</option>
      </select>
    </div>
    <div class="form-group" id="addrGroup" style="display:none;">
      <label>Етказиб бериш манзили (Самарқанд)</label>
      <input type="text" id="inpAddress" placeholder="Кўча, уй, мўлжал..." />
    </div>
    <div class="form-group">
      <label>Тўлов тури</label>
      <select id="inpPayment">
        <option value="Click">💳 Click (карта орқали)</option>
        <option value="Payme">💳 Payme (карта орқали)</option>
        <option value="Нақд пул">💵 Нақд пул</option>
      </select>
    </div>
    <button class="submit-btn" onclick="submitOrder()">✅ Буюртмани тасдиқлаш</button>
  </div>
</div>

<!-- PROFILE -->
<div class="section" id="sec-profile">
  <div class="sec-title">👤 Менинг кабинетим</div>
  <div class="dm-box">
    <div class="dm-kv"><span class="dm-k">Мижоз</span><span class="dm-v" id="profName">Меҳмон</span></div>
    <div class="dm-kv"><span class="dm-k">Бонус карта</span><span class="dm-v" id="profCard">VTR-000001</span></div>
    <div class="dm-kv"><span class="dm-k">Бонус баланс</span><span class="dm-v" style="color:var(--green)">5 000 сўм</span></div>
    <div class="dm-kv"><span class="dm-k">Филиал</span><span class="dm-v">Самарқанд ш. (08:00–22:00)</span></div>
  </div>
</div>

<!-- FULL PRODUCT DETAIL MODAL -->
<div class="detail-modal" id="detailModal">
  <div class="dm-topbar">
    <button class="dm-back" onclick="closeDetail()">← Back</button>
  </div>
  <div id="detailContent"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
    <span class="nav-icon">🏠</span><span>Асосий</span>
  </div>
  <div class="nav-item" id="nav-cat" onclick="switchTab('cat')">
    <span class="nav-icon">📦</span><span>Каталог</span>
  </div>
  <div class="nav-item" id="nav-cart" onclick="switchTab('cart')">
    <span class="nav-icon">🛍</span><span>Буюртмалар</span>
    <span class="badge" id="cartBadge" style="display:none;">0</span>
  </div>
  <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
    <span class="nav-icon">•••</span><span>Яна</span>
  </div>
</div>

<script>
  const API_BASE = "https://vitora-bot.onrender.com";
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.expand(); tg.ready(); }

  let allProducts = [];
  let selectedCat = "Барчаси";
  let cart = JSON.parse(localStorage.getItem("vitora_cart") || "[]");
  let detailQty = 1;

  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
  if (user) {
    document.getElementById("profName").textContent = user.first_name || "Мижоз";
    document.getElementById("inpName").value = user.first_name || "";
    document.getElementById("profCard").textContent = "VTR-" + (user.id || 1).toString(16).toUpperCase().padStart(8, "0").slice(0,8);
  }

  function getVisualStyle(p) {
    const text = ((p.name || "") + " " + (p.category || "")).toLowerCase();
    if (text.includes("омега") || text.includes("omega") || text.includes("рыбий")) {
      return { bg: "linear-gradient(135deg,#fef3c7,#fde68a)", emoji: "🐟", label: "OMEGA-3", pills: ["❤️ Юрак саломатлиги", "🧠 Диққат ва хотира", "⏳ Соғлом кексайиш"] };
    }
    if (text.includes("фито") || text.includes("трав") || text.includes("сироп") || text.includes("шиповник") || text.includes("эвкалипт") || text.includes("масло")) {
      return { bg: "linear-gradient(135deg,#dcfce7,#bbf7d0)", emoji: "🌿", label: "PHYTO", pills: ["🌿 Табиий экстракт", "🛡 Иммунитет", "🍃 Соғлом организм"] };
    }
    if (text.includes("магн") || text.includes("кальц") || text.includes("цинк") || text.includes("желез") || text.includes("минерал")) {
      return { bg: "linear-gradient(135deg,#e0e7ff,#c7d2fe)", emoji: "💎", label: "MINERAL", pills: ["⚡ Энергия ва тонус", "🦴 Суяк ва мушаклар", "😌 Асаб тизими"] };
    }
    if (text.includes("коллаген") || text.includes("биотин") || text.includes("гиалурон")) {
      return { bg: "linear-gradient(135deg,#fce7f3,#fbcfe8)", emoji: "✨", label: "BEAUTY", pills: ["✨ Тери ва сочлар", "💅 Тирноқ мустаҳкамлиги", "⏳ Ёшлик манбаи"] };
    }
    return { bg: "linear-gradient(135deg,#dbeafe,#bfdbfe)", emoji: "💊", label: "VITAMIN", pills: ["🛡 Кучли иммунитет", "⚡ Кунлик қувват", "🧬 Мувозанатли таркиб"] };
  }

  function extractPackCount(name) {
    const m = name.match(/(?:№|N|х|\*)\s*(\d+)/i);
    return m ? parseInt(m[1], 10) : null;
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${API_BASE}/api/products`);
      const data = await res.json();
      allProducts = data.products || [];
      buildCategories();
      renderProducts();
      updateCartBadge();
    } catch (e) {
      document.getElementById("productGrid").innerHTML = "<p style='color:#94a3b8'>Юкланмоқда...</p>";
    }
  }

  function buildCategories() {
    const cats = ["Барчаси", ...new Set(allProducts.map(p => p.category).filter(Boolean))];
    const bar = document.getElementById("catBar");
    bar.innerHTML = cats.slice(0, 15).map(c =>
      `<button class="cat-btn ${c === selectedCat ? 'active' : ''}" onclick="selectCat('${c.replace(/'/g, "\\'")}')">${c}</button>`
    ).join("");
  }

  function selectCat(c) {
    selectedCat = c;
    buildCategories();
    renderProducts();
  }

  function renderProducts() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const list = allProducts.filter(p => {
      const matchCat = selectedCat === "Барчаси" || p.category === selectedCat;
      const matchQ = !q || (p.name || "").toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q);
      return matchCat && matchQ;
    });

    const grid = document.getElementById("productGrid");
    grid.innerHTML = list.map(p => {
      const st = getVisualStyle(p);
      const thumb = p.image
        ? `<img src="${p.image}" alt="" onerror="this.style.display='none'" />`
        : `<div class="p-emoji">${st.emoji}</div><div class="p-tag-txt">${st.label}</div>`;
      return `
        <div class="p-card" onclick="openDetail(${p.id})">
          <div>
            <div class="p-thumb" style="background:${st.bg}">
              <span class="p-id-badge">${p.id}</span>
              ${thumb}
            </div>
            <div class="p-name">${p.name}</div>
            <div class="p-cat">${p.category || 'БАДы'}</div>
            ${p.description ? `<div class="p-desc">${p.description}</div>` : ''}
            <div class="p-stock">Қолдиқ: ${p.stock} дона</div>
          </div>
          <div class="p-bottom">
            <div class="p-price">${Number(p.price || 0).toLocaleString()} сўм</div>
            <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id}, 1)">+</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function openDetail(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    detailQty = 1;
    const st = getVisualStyle(p);
    const pack = extractPackCount(p.name || "");
    const unitPrice = pack && p.price > 0 ? Math.round(p.price / pack) : null;
    const code = "VM-" + String(p.id).padStart(6, "0");

    const hero = p.image
      ? `<img src="${p.image}" alt="" />`
      : `<div style="font-size:64px;margin-bottom:6px;">${st.emoji}</div><div style="font-size:15px;font-weight:800;color:#1e293b;letter-spacing:1px;">${st.label}</div>`;

    const related = allProducts.filter(x => x.id !== p.id && x.category === p.category).slice(0, 8);
    const relHtml = related.map(r => {
      const rst = getVisualStyle(r);
      const rthumb = r.image ? `<img src="${r.image}" alt="" />` : `<div style="font-size:30px;">${rst.emoji}</div>`;
      return `
        <div class="rel-card" onclick="openDetail(${r.id})">
          <div class="rel-thumb" style="background:${rst.bg}">${rthumb}</div>
          <div class="rel-name">${r.name}</div>
          <div class="rel-price">${Number(r.price || 0).toLocaleString()} сўм</div>
        </div>
      `;
    }).join("");

    document.getElementById("detailContent").innerHTML = `
      <div class="dm-hero" style="background:${st.bg}">${hero}</div>
      <div class="dm-body">
        <div class="dm-title">${p.name}</div>
        <div class="dm-sub">
          ${p.description || p.category || 'БАДы'}<br/>
          Тоифа: ${p.category || 'БАДы'}
        </div>

        <div class="dm-price-row">
          <div class="dm-price">${Number(p.price || 0).toLocaleString()} сўм</div>
          <div class="dm-avail">${p.stock > 0 ? 'Бор (' + p.stock + ' дона)' : 'Тугаган'}</div>
        </div>
        ${unitPrice ? `<div class="dm-unit-note">1 дона ≈ ${unitPrice.toLocaleString()} сўм (қопламада × ${pack})</div>` : '<div style="margin-bottom:12px;"></div>'}

        <div class="dm-pills">
          <span class="dm-pill pill-pink">${st.pills[0]}</span>
          <span class="dm-pill pill-blue">${st.pills[1]}</span>
          <span class="dm-pill pill-amber">${st.pills[2]}</span>
        </div>

        <div class="dm-box">
          ${pack ? `<div class="dm-kv"><span class="dm-k">Ўрам</span><span class="dm-v">× ${pack}</span></div>` : ''}
          <div class="dm-kv">
            <span class="dm-k">Сақлаш</span>
            <span class="dm-v">Қуруқ жойда, хона ҳароратида сақланг.<br/>Юқори ва паст ҳарорат, намлик ва ёруғликдан сақланг.</span>
          </div>
          <div class="dm-kv"><span class="dm-k">Код</span><span class="dm-v">${code}</span></div>
        </div>

        <div class="dm-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <strong style="font-size:15px;">Таркиб ва маълумот</strong>
            <span style="font-size:12px;color:var(--muted);">${p.category || 'БАД'}</span>
          </div>
          <div style="font-size:13px;color:var(--muted);line-height:1.4;">
            ${p.description || p.name}
          </div>
        </div>

        <div class="dm-warn">
          Биологик фаол қўшимча. Дори воситаси эмас. Қўллашдан олдин шифокор билан маслаҳатлашинг.
        </div>

        <div class="dm-action-bar">
          <div class="qty-stepper">
            <button onclick="changeDetailQty(-1)">−</button>
            <span id="dmQtyVal">1</span>
            <button onclick="changeDetailQty(1)">+</button>
          </div>
          <button class="dm-cart-btn" onclick="addFromDetail(${p.id})">Саватга</button>
        </div>

        ${related.length ? `
          <div class="rel-title">Бу билан бирга олишади</div>
          <div class="rel-row">${relHtml}</div>
        ` : ''}
      </div>
    `;
    const modal = document.getElementById("detailModal");
    modal.classList.add("open");
    modal.scrollTop = 0;
  }

  function closeDetail() {
    document.getElementById("detailModal").classList.remove("open");
  }

  function changeDetailQty(delta) {
    detailQty = Math.max(1, detailQty + delta);
    const el = document.getElementById("dmQtyVal");
    if (el) el.textContent = detailQty;
  }

  function addFromDetail(id) {
    addToCart(id, detailQty);
    closeDetail();
  }

  function addToCart(id, qty) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    const existing = cart.find(x => x.id === id);
    if (existing) existing.qty += qty;
    else cart.push({ id: p.id, name: p.name, price: p.price, qty: qty });
    localStorage.setItem("vitora_cart", JSON.stringify(cart));
    updateCartBadge();
    showToast("✅ Саватга қўшилди!");
  }

  function updateCartBadge() {
    const count = cart.reduce((s, x) => s + x.qty, 0);
    const b = document.getElementById("cartBadge");
    b.style.display = count > 0 ? "block" : "none";
    b.textContent = count;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 1600);
  }

  function switchTab(tab) {
    closeDetail();
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    document.getElementById("topHeader").style.display = (tab === "home" || tab === "cat") ? "block" : "none";

    if (tab === "home" || tab === "cat") {
      document.getElementById("sec-home").classList.add("active");
      document.getElementById("secTitle").textContent = tab === "cat" ? "Категориялар ва Каталог" : "Оммабоп маҳсулотлар";
      document.getElementById("nav-" + tab).classList.add("active");
    } else if (tab === "cart") {
      document.getElementById("sec-cart").classList.add("active");
      document.getElementById("nav-cart").classList.add("active");
      renderCart();
    } else {
      document.getElementById("sec-profile").classList.add("active");
      document.getElementById("nav-profile").classList.add("active");
    }
  }

  function renderCart() {
    const list = document.getElementById("cartList");
    const totalBox = document.getElementById("cartTotalBox");
    const form = document.getElementById("orderForm");

    if (!cart.length) {
      list.innerHTML = "<p style='color:#94a3b8'>Саватча ҳозирча бўш.</p>";
      totalBox.textContent = "";
      form.style.display = "none";
      return;
    }
    let total = 0;
    list.innerHTML = cart.map((item, idx) => {
      total += item.price * item.qty;
      return `
        <div class="cart-item">
          <div>
            <div style="font-size:13px;font-weight:700;">${item.name}</div>
            <div style="font-size:12px;color:#94a3b8;">${item.qty} × ${item.price.toLocaleString()} сўм</div>
          </div>
          <button onclick="removeCart(${idx})" style="background:#ef4444;color:#fff;border:none;border-radius:8px;padding:5px 9px;">✕</button>
        </div>
      `;
    }).join("");
    totalBox.textContent = `Жами: ${total.toLocaleString()} сўм`;
    form.style.display = "block";
  }

  function removeCart(idx) {
    cart.splice(idx, 1);
    localStorage.setItem("vitora_cart", JSON.stringify(cart));
    updateCartBadge();
    renderCart();
  }

  function toggleAddress() {
    const d = document.getElementById("inpDelivery").value;
    document.getElementById("addrGroup").style.display = d.includes("Курьер") ? "block" : "none";
  }

  async function submitOrder() {
    const name = document.getElementById("inpName").value.trim() || "Мижоз";
    const phone = document.getElementById("inpPhone").value.trim();
    if (!phone) { alert("Илтимос, телефон рақамингизни киритинг!"); return; }

    const delivery = document.getElementById("inpDelivery").value;
    const address = document.getElementById("inpAddress").value.trim();
    const payment = document.getElementById("inpPayment").value;
    const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
    const itemsText = cart.map(x => `• ${x.name} (${x.qty} дона) — ${(x.price * x.qty).toLocaleString()} сўм`).join("\n");

    try {
      const res = await fetch(`${API_BASE}/api/order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: user ? user.id : 0,
          name: name,
          username: user ? (user.username || "yoq") : "yoq",
          card: document.getElementById("profCard").textContent,
          phone: phone,
          delivery_type: delivery,
          address: address,
          payment_method: payment,
          items: itemsText,
          total: total,
          cart: cart
        })
      });
      const data = await res.json();
      if (data.ok) {
        cart = [];
        localStorage.setItem("vitora_cart", "[]");
        updateCartBadge();
        renderCart();
        showToast("✅ Буюртма #" + data.order_id + " юборилди!");
        if (tg) setTimeout(() => tg.close(), 1200);
      }
    } catch (e) {
      alert("Хатолик юз берди, қайта уриниб кўринг.");
    }
  }

  loadProducts();
</script>
</body>
</html>
