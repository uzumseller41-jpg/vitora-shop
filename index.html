    :root {

      --card: #ffffff;
      --card2: #f8fbfa;
      --text: #0f2922;

      --emerald: #0d7a53;
      --emerald-bright: #10b981;
      --blue: #1565c0;
      --gold: #d97706;
      --border: #d5e4df;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    body { padding-bottom: 92px; }

    @keyframes unrollCurtain {
      0% { opacity: 0; transform: perspective(900px) rotateX(-22deg) translateY(-18px) scale(0.94); }
      100% { opacity: 1; transform: perspective(900px) rotateX(0deg) translateY(0) scale(1); }
    }
    @keyframes depthZoomIn {
      0% { opacity: 0; transform: scale(0.78) translateY(24px); }
      70% { opacity: 1; transform: scale(1.02) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes floatGear {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(8deg); }
    }

    .header {
      padding: 12px 16px 10px;
      position: sticky; top: 0;
      background: rgba(255, 255, 255, 0.94);

      z-index: 30;

    .greet-txt { font-size: 16px; font-weight: 800; color: var(--emerald); }
    .greet-tier {
      font-size: 11px;
      background: linear-gradient(135deg, rgba(217,119,6,0.14), rgba(16,185,129,0.14));
      color: #92400e;
      padding: 4px 10px; border-radius: 12px; font-weight: 800;
      border: 1px solid rgba(217,119,6,0.35);
    }

    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 9px 14px;
    }
    .search-box input { background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; width: 100%; }

    .filter-bar { display: flex; gap: 7px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .f-chip {
      background: #ffffff; color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
      white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .f-chip.active {
      background: linear-gradient(135deg, var(--emerald), var(--blue));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(13, 122, 83, 0.25);
    }

    .section { padding: 14px 16px; display: none; }
    .section.active { display: block; animation: unrollCurtain 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .promo-banner {
      background: linear-gradient(135deg, #0b6e4f 0%, #1565c0 75%, #0284c7 100%);
      border-radius: 20px; padding: 18px; margin-bottom: 18px;
      color: #fff; cursor: pointer; position: relative; overflow: hidden;
      box-shadow: 0 12px 26px rgba(11, 110, 79, 0.24);
      border-bottom: 3px solid #f59e0b;

    .promo-tag { display: inline-block; background: rgba(245, 158, 11, 0.92); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 8px; margin-bottom: 6px; letter-spacing: 0.6px; }
    .promo-title { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .promo-sub { font-size: 13px; color: #e0f2fe; }

    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sec-title { font-size: 18px; font-weight: 800; color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .p-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 10px;

      cursor: pointer; position: relative;

    .p-card.pop-zoom { transform: scale(1.07) translateY(-5px) !important; box-shadow: 0 16px 32px rgba(13, 122, 83, 0.28); z-index: 15; border-color: var(--emerald); }

    .p-thumb {
      position: relative; height: 122px; border-radius: 14px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
      background: linear-gradient(135deg, #e6f4f0, #e0f2fe);

    .disc-badge { position: absolute; bottom: 6px; left: 6px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 8px; }
    .like-btn { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(255,255,255,0.9); color: #0f2922; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.12); z-index: 3; }
    .like-btn.liked { color: #ef4444; }

    .p-name { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .p-meta-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--gold); margin-bottom: 5px; font-weight: 700; }
    .p-old-price { font-size: 11px; color: #94a3b8; text-decoration: line-through; }
    .p-price { font-size: 15px; font-weight: 800; margin-bottom: 2px; color: var(--blue); }
    .p-stock { font-size: 11px; color: var(--emerald); font-weight: 700; margin-bottom: 8px; }

    .card-cart-btn {

      background: linear-gradient(135deg, var(--emerald), #0f9d6b);
      color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;

    .card-qty-bar {
      width: 100%; height: 36px; border-radius: 11px;

  function startLiveCamera() {
    stopCameraScanner();
    if (typeof Html5Qrcode === "undefined") return;
    html5QrScanner = new Html5Qrcode("qrReaderBox");
    html5QrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        stopCameraScanner();
        showToast("✅ QR ўқилди: " + decodedText);
        document.getElementById("manualVtrInput").value = decodedText;
        lookupClientCode(decodedText);
      },
      () => {}
    ).catch(() => {
      document.getElementById("qrReaderBox").innerHTML = `<div style="padding:18px;color:#fff;font-size:13px;">⚠️ Камерага рухсат берилмади. Пастдаги майдонга <b>VTR-...</b> рақамини ёзинг.</div>`;
    });
  }

  async function lookupClientCode(rawCode) {
    const q = (rawCode || "").trim();
    if (!q) return;
    const resBox = document.getElementById("scanResultBox");
    resBox.innerHTML = `<div class="info-card"><p>⏳ Қидирилмоқда...</p></div>`;

    try {
      const res = await fetch(`${API_BASE}/api/staff/scan_lookup?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!data.ok) {
        resBox.innerHTML = `<div class="info-card" style="border-color:#ef4444;"><p style="color:#dc2626;font-weight:700;">❌ ${data.error}</p></div>`;
        return;
      }

      let html = "";
      if (data.client) {
        const c = data.client;
        html += `
          <div class="info-card" style="background:#ecfdf5;border-color:#10b981;">
            <h4>👤 МИЖОЗ МАЪЛУМОТЛАРИ</h4>
            <p><b>Исм:</b> ${c.name || 'Мижоз'}</p>
            <p><b>Шахсий код:</b> <code>${c.card_id}</code></p>
            <p><b>Телефон:</b> ${c.phone || '—'}</p>
            <p><b>Даража:</b> ${c.tier} | <b>Бонус:</b> <b>${Number(c.bonus || 0).toLocaleString()} сўм</b></p>
          </div>
        `;
      }

      if (data.orders && data.orders.length) {
        data.orders.forEach(o => {
          const paid = o.payment_status === "Тўланган ✅";
          const toCollect = o.final_payable || o.total;
          html += `
            <div class="info-card">
              <h4>🧾 БУЮРТМА #${o.id} · ${o.order_status}</h4>
              <p style="margin-bottom:6px;">🛒 ${o.items}</p>
              <p>💳 Тўлов тури: <b>${o.payment_method}</b> (${o.payment_status})</p>
              <p style="font-size:16px;color:var(--blue);font-weight:800;margin-top:6px;">
                ${paid ? "✅ Тўлов тўлиқ амалга оширилган (0 сўм)" : `💵 Мижоздан олинади: ${Number(toCollect).toLocaleString()} сўм`}
              </p>
              <div style="display:flex;gap:8px;margin-top:10px;">
                ${!paid ? `<button onclick="staffOrderAction(${o.id}, 'pay_ok', '${q}')" style="flex:1;background:var(--blue);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:800;">💳 Тўлов олинди</button>` : ''}
                ${o.order_status !== "Топширилган ✅" ? `<button onclick="staffOrderAction(${o.id}, 'handover', '${q}')" style="flex:1;background:var(--emerald);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:800;">🏁 Топширилди</button>` : ''}
              </div>
            </div>
          `;
        });
      } else {
        html += `<div class="info-card"><p>ℹ️ Ушбу мижозда ҳозирча фаол онлайн буюртма йўқ (дўконнинг ўзидан харид қилмоқда).</p></div>`;
      }
      resBox.innerHTML = html;
    } catch (e) {
      resBox.innerHTML = `<div class="info-card"><p>❌ Сервер билан алоқа хатоси.</p></div>`;
    }
  }

  // ================= ODDIY DO'KON VA SAVATCHA FUNKSIYALARI =================
  function getCartQty(id) {
    const f = cart.find(x => x.id === id);
    return f ? f.qty : 0;
  }

  async function changeCardQty(id, delta, ev) {
    if (ev) ev.stopPropagation();
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    const maxAvail = p.available_stock !== undefined ? p.available_stock : p.stock;
    const targetQty = getCartQty(id) + delta;

    if (delta > 0 && targetQty > maxAvail) {
      showToast(`⚠️ Жами ${maxAvail} дона мавжуд!`);
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/reserve`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, product_id: id, qty: Math.max(0, targetQty) })
      });
      const rdata = await res.json();
      const allowed = rdata.allowed_qty;

      const idx = cart.findIndex(x => x.id === id);
      if (allowed <= 0) {
        if (idx !== -1) cart.splice(idx, 1);
      } else if (idx === -1) {
        cart.push({ id: p.id, name: p.name, price: p.price, qty: allowed });
      } else {
        cart[idx].qty = allowed;
      }
      localStorage.setItem("vitora_cart", JSON.stringify(cart));
      updateCartBadge();
      renderHome();
      renderCatalog();
    } catch (e) {}
  }

  function popAndOpenDetail(id, cardEl) {
    if (cardEl) {
      cardEl.classList.add("pop-zoom");
      setTimeout(() => {
        cardEl.classList.remove("pop-zoom");
        openDetail(id);
      }, 200);
    } else {
      openDetail(id);
    }
  }

  function productCardHtml(p, idx = 0) {
    const liked = likes.includes(p.id);
    const inCartQty = getCartQty(p.id);
    const avail = p.available_stock !== undefined ? p.available_stock : p.stock;
    const thumb = p.image ? `<img src="${p.image}" alt="" />` : `<div style="font-size:42px;">🌿</div>`;
    const delay = Math.min(idx * 0.05, 0.4);

    const actionHtml = inCartQty > 0
      ? `<div class="card-qty-bar" onclick="event.stopPropagation()">
           <button onclick="changeCardQty(${p.id}, -1, event)">−</button>
           <span style="font-weight:800;color:var(--emerald);">+${inCartQty}</span>
           <button onclick="changeCardQty(${p.id}, 1, event)">+</button>
         </div>`
      : `<button class="card-cart-btn" onclick="changeCardQty(${p.id}, 1, event)">${T.addCart}</button>`;

    return `
      <div class="p-card" style="animation-delay:${delay}s" onclick="popAndOpenDetail(${p.id}, this)">
        <div>
          <div class="p-thumb">
            <span class="p-brand-tag">${p.brand || 'Vitora'}</span>
            ${p.discount_pct ? `<span class="disc-badge">-${p.discount_pct}%</span>` : ''}
            <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike(${p.id}, event)">${liked ? '❤️' : '♡'}</button>
            ${thumb}
          </div>
          <div class="p-name">${p.name}</div>
          <div class="p-meta-row">
            <span>⭐ ${Number(p.rating_avg || 5).toFixed(1)}</span>
            <span style="color:var(--muted);">Sold: ${p.sold_count || 0}</span>
          </div>
        </div>
        <div>
          ${p.old_price > p.price ? `<div class="p-old-price">${Number(p.old_price).toLocaleString()} сўм</div>` : ''}
          <div class="p-price">${Number(p.price || 0).toLocaleString()} сўм</div>
          <div class="p-stock">Stock: ${avail}</div>
          ${actionHtml}
        </div>
      </div>
    `;
  }

  function getFilteredProducts() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    let list = allProducts.filter(p => {
      const matchQ = !q || (p.name || "").toLowerCase().includes(q) || (p.brand || "").toLowerCase().includes(q) || (p.category || "").toLowerCase().includes(q);
      const matchB = selectedBrand === "ALL" || (p.brand || "Vitora") === selectedBrand;
      return matchQ && matchB;
    });

    if (currentSort === "cheap") list.sort((a, b) => a.price - b.price);
    else if (currentSort === "expensive") list.sort((a, b) => b.price - a.price);
    else if (currentSort === "rating") list.sort((a, b) => (b.rating_avg || 5) - (a.rating_avg || 5));
    else if (currentSort === "discount") list = list.filter(x => (x.discount_pct || 0) > 0);
    return list;
  }

  function setSort(s, el) {
    currentSort = s;
    document.querySelectorAll("#filterBar .f-chip").forEach(c => c.classList.remove("active"));
    if (el) el.classList.add("active");
    renderHome();
    renderCatalog();
  }

  function setBrand(b) {
    selectedBrand = b;
    renderCatalog();
  }

  function renderBrandChips() {
    const brands = ["ALL", ...new Set(allProducts.map(p => p.brand || "Vitora"))];
    document.getElementById("brandChips").innerHTML = brands.map(b =>
      `<button class="f-chip ${selectedBrand === b ? 'active' : ''}" onclick="setBrand('${b}')">${b === 'ALL' ? '🏷 All' : b}</button>`
    ).join("");

  async function loadProducts() {
    applyTranslationsAndRoleUI();
    const hr = new Date().getHours();
    const greet = LANG === "en" ? (hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening")
                : LANG === "ru" ? (hr < 12 ? "Доброе утро" : hr < 18 ? "Добрый день" : "Добрый вечер")
                : (hr < 12 ? "Хайрли тонг" : hr < 18 ? "Хайрли кун" : "Хайрли кеч");
    document.getElementById("greetingText").textContent = `${greet}${user && user.first_name ? ', ' + user.first_name : ''}! 👋`;

    try {
      const res = await fetch(`${API_BASE}/api/products`);
      const data = await res.json();
      allProducts = data.products || [];
      allNews = data.news || [];
      if (data.card_number) document.getElementById("humoCardNum").textContent = data.card_number;

      if (!IS_STAFF && user && user.id) {
        const ures = await fetch(`${API_BASE}/api/user/${user.id}`);

        document.getElementById("headerTierBadge").textContent = `${userProfile.tier} · ${userProfile.cashback_pct}%`;
      }
      renderBrandChips();
      renderHome();
      renderCatalog();
      updateCartBadge();

  function renderHome() {
    const list = getFilteredProducts();

  function renderCatalog() {
    renderBrandChips();
    const list = getFilteredProducts();
    document.getElementById("catalogGrid").innerHTML = list.map((p, i) => productCardHtml(p, i)).join("");

  function onSearchInput() {
    if (!document.getElementById("sec-cat").classList.contains("active")) switchTab("cat");

  function toggleLike(id, ev) {
    if (ev) ev.stopPropagation();
    if (likes.includes(id)) likes = likes.filter(x => x !== id);
    else likes.push(id);
    localStorage.setItem("vitora_likes", JSON.stringify(likes));
    renderHome();
    renderCatalog();

  async function rateProduct(pid, stars) {
    try {
      const res = await fetch(`${API_BASE}/api/rate_product`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: pid, stars })
      });
      const d = await res.json();
      if (d.ok) {
        const p = allProducts.find(x => x.id === pid);
        if (p) { p.rating_avg = d.rating_avg; p.rating_cnt = d.rating_cnt; }
        showToast(`⭐ ${stars} saved!`);
        openDetail(pid);
      }
    } catch (e) {}
  }

      body.innerHTML = `<div style="padding:16px;"><div class="grid">${favItems.length ? favItems.map((p,i) => productCardHtml(p,i)).join("") : "<p>Бўш.</p>"}</div></div>`;
    } else if (type === "loc") {
      document.getElementById("fmTopTitle").textContent = "Жойлашув";
      body.innerHTML = `<div style="padding:16px;"><div class="info-card"><h4>🏥 Vitora | Smart Pharm</h4><p>📍 Самарқанд шаҳар, Қозизода Румий 56 А уй<br>🕒 08:00 – 24:00</p></div></div>`;
    } else if (type === "news") {
      document.getElementById("fmTopTitle").textContent = "Янгиликлар";
      body.innerHTML = `<div style="padding:16px;">${allNews.length ? allNews.map(n => `<div class="info-card">${n.image ? `<img src="${n.image}" style="width:100%;border-radius:12px;margin-bottom:8px;">` : ''}<p>${n.body}</p></div>`).join("") : "<p>Янгиликлар йўқ.</p>"}</div>`;
    }
  }

  function closeModal() {
    stopCameraScanner();
    document.getElementById("fullModal").classList.remove("open");
  }

  function updateCartBadge() {
    const count = cart.reduce((a, b) => a + b.qty, 0);
    const badge = document.getElementById("cartBadge");
    badge.style.display = count > 0 ? "block" : "none";
    badge.textContent = count;
  }

  function renderCart() {
    const listEl = document.getElementById("cartList");
    const totalBox = document.getElementById("cartTotalBox");
    const formEl = document.getElementById("orderForm");
    const bonusBox = document.getElementById("bonusToggleBox");

    if (!cart.length) {
      listEl.innerHTML = "<p style='color:var(--muted);'>Саватча бўш.</p>";
      totalBox.innerHTML = "";
      formEl.style.display = "none";
      bonusBox.style.display = "none";
      return;
    }

    let total = 0;
    listEl.innerHTML = cart.map(item => {
      total += item.price * item.qty;
      return `
        <div class="cart-item">
          <div><div style="font-weight:700;font-size:14px;">${item.name}</div><div style="font-size:13px;color:var(--blue);font-weight:700;">${(item.price * item.qty).toLocaleString()} сўм</div></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button onclick="changeCardQty(${item.id}, -1); renderCart();" style="width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:800;">−</button>
            <span style="font-weight:800;">${item.qty}</span>
            <button onclick="changeCardQty(${item.id}, 1); renderCart();" style="width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:800;">+</button>
          </div>
        </div>
      `;
    }).join("");

    let disc = 0;
    if (!IS_STAFF && userProfile.bonus > 0) {
      bonusBox.style.display = "block";
      const maxUse = Math.min(userProfile.bonus, Math.floor(total * 0.3));
      document.getElementById("bonusChkText").textContent = `🎁 Бонус ишлатиш (-${maxUse.toLocaleString()} сўм)`;
      if (document.getElementById("chkUseBonus").checked) disc = maxUse;
    }

    const finalPay = Math.max(0, total - disc);
    totalBox.innerHTML = `Тўлов: <span style="color:var(--emerald);">${finalPay.toLocaleString()} сўм</span>`;
    formEl.style.display = "block";
  }

  function toggleAddress() {
    document.getElementById("addrGroup").style.display = document.getElementById("inpDelivery").value.includes("Курьер") ? "block" : "none";
  }

  function toggleCardBox() {
    const pm = document.getElementById("inpPayment").value;
    document.getElementById("cardCopyBox").style.display = (pm === "Click" || pm === "Payme") ? "flex" : "none";
  }

  function copyCardNum() {
    const num = document.getElementById("humoCardNum").textContent.replace(/\s+/g, "");
    navigator.clipboard.writeText(num);
    showToast("📋 Карта рақами нусхаланди!");
  }

  async function submitOrder() {
    const name = document.getElementById("inpName").value.trim();
    const phone = document.getElementById("inpPhone").value.trim();
    const delivery_type = document.getElementById("inpDelivery").value;
    const address = document.getElementById("inpAddress").value.trim();
    const payment_method = document.getElementById("inpPayment").value;
    const use_bonus = document.getElementById("chkUseBonus").checked;

    if (!name || !phone) {
      showToast("⚠️ Исм ва телефонни киритинг!");
      return;
    }

    const total = cart.reduce((a, b) => a + b.price * b.qty, 0);
    const items = cart.map(x => `${x.name} x${x.qty}`).join(", ");

    try {
      const res = await fetch(`${API_BASE}/api/order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: user ? user.id : 0,
          session_id: sessionId,
          name, username: user && user.username ? user.username : "yoq",
          card: userCardId, phone, delivery_type, address, payment_method, items, total, use_bonus, cart
        })
      });
      const data = await res.json();
      if (data.ok) {
        cart = [];
        localStorage.setItem("vitora_cart", "[]");
        updateCartBadge();
        showToast("✅ Буюртма #" + data.order_id + " юборилди!");
        loadProducts();
        switchTab("home");
      }
    } catch (e) {}
  }

  function switchTab(tab) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    document.getElementById("sec-" + tab).classList.add("active");
    const nav = document.getElementById("nav-" + tab);
    if (nav) nav.classList.add("active");
    if (tab === "cart") renderCart();
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2200);
  }

  loadProducts();
</script>
</body>
</html>
